<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة العالم 📚</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شريط التنقل (Navbar) -->
    <header>
        <div class="logo">م📚</div>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">الكتب</a></li>
                <li><a href="#">العروض</a></li>
                <li><a href="#">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <!-- واجهة الموقع (Hero Section) -->
    <section class="hero">
        <h1>اكتشف عوالم جديدة بين صفحات كتبنا</h1>
        <p>أفضل الكتب بأسعار خيالية، وتوصيل لحد باب البيت.</p>
        <button class="cta-btn">تصفح الكتب</button>
    </section>

    <!-- قسم عرض الكتب (Books Grid) -->
    <section class="books-section">
        <h2>أحدث الإصدارات</h2>
        <div class="books-grid">
            <!-- كتاب 1 -->
            <div class="book-card">
                <div class="book-cover">📘</div>
                <h3>فن اللامبالاة</h3>
                <p class="price">150 ج.م</p>
                <button class="add-to-cart">أضف للسلة</button>
            </div>
            <!-- كتاب 2 -->
            <div class="book-card">
                <div class="book-cover">📕</div>
                <h3>مقدمة في الأمن السيبراني</h3>
                <p class="price">180 ج.م</p>
                <button class="add-to-cart">أضف للسلة</button>
            </div>
            <!-- كتاب 3 -->
            <div class="book-card">
                <div class="book-cover">📗</div>
                <h3>الجريمة والعقاب</h3>
                <p class="price">200 ج.م</p>
                <button class="add-to-cart">أضف للسلة</button>
            </div>
        </div>
    </section>

    <!-- الفوتر (Footer) -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مكتبة العالم</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
